<svg xmlns="http://www.w3.org/2000/svg" width="700" height="635" viewBox="100 0 700 635" role="img" aria-labelledby="title desc">
  <title id="title">Wired-AND Open-Drain NAND Gates Driving Three NOR Gates</title>
  <desc id="desc">Two two-input open-drain NAND gates G1 (inputs A, B) and G2 (inputs C, D) wired-AND together with pull-up resistor RL to V'DD, driving all three inputs of NOR gates G3, G4, and G5.</desc>
  <defs>
    <style>
      .wire, .gate-box, .resistor, .terminal, .bubble, .od-sym {
        fill: none;
        stroke: #111111;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bubble, .terminal {
        fill: #ffffff;
      }
      .junction {
        fill: #111111;
        stroke: none;
      }
      .gate-sym {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }
      .gate-id {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 26px;
      }
      .label {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 27px;
        font-style: italic;
      }
      .sub {
        font-size: 18px;
        font-style: normal;
      }
      .sup {
        font-size: 20px;
        font-style: normal;
      }
    </style>

    <g id="od-diamond">
      <polygon class="od-sym" points="0,-13 15,0 0,13 -15,0"/>
      <line class="od-sym" x1="-15" y1="16" x2="15" y2="16"/>
    </g>
  </defs>

  <g id="diagram">
    <!-- Wires -->
    <g id="wires">
      <!-- Inputs to G1 and G2 -->
      <line class="wire" x1="204" y1="204" x2="274" y2="204"/>
      <line class="wire" x1="204" y1="270" x2="274" y2="270"/>
      <line class="wire" x1="204" y1="362" x2="274" y2="362"/>
      <line class="wire" x1="204" y1="428" x2="274" y2="428"/>

      <!-- Pull-up branch to V'DD -->
      <line class="wire" x1="456" y1="27" x2="456" y2="76"/>
      <line class="wire" x1="456" y1="124" x2="456" y2="238"/>

      <!-- Wired-AND node F -->
      <line class="wire" x1="374" y1="238" x2="543" y2="238"/>
      <polyline class="wire" points="374,396 456,396 456,238"/>

      <!-- Bus feeding G3, G4, G5 -->
      <polyline class="wire" points="543,204 492,204 492,588 543,588"/>
      <line class="wire" x1="492" y1="272" x2="543" y2="272"/>
      <line class="wire" x1="492" y1="362" x2="543" y2="362"/>
      <line class="wire" x1="492" y1="396" x2="543" y2="396"/>
      <line class="wire" x1="492" y1="430" x2="543" y2="430"/>
      <line class="wire" x1="492" y1="520" x2="543" y2="520"/>
      <line class="wire" x1="492" y1="554" x2="543" y2="554"/>

      <!-- Outputs of G3, G4, G5 -->
      <line class="wire" x1="643" y1="238" x2="704" y2="238"/>
      <line class="wire" x1="643" y1="396" x2="704" y2="396"/>
      <line class="wire" x1="643" y1="554" x2="704" y2="554"/>
    </g>

    <!-- Pull-up resistor & terminal -->
    <g id="pullup">
      <circle id="term-vdd" class="terminal" cx="456" cy="22" r="5"/>
      <rect id="res-RL" class="resistor" x="447" y="76" width="18" height="48"/>
    </g>

    <!-- Open-drain NAND gates G1, G2 -->
    <g id="gates-od">
      <g id="gate-G1">
        <rect class="gate-box" x="274" y="172" width="88" height="132"/>
        <text class="gate-sym" x="318" y="210">&amp;</text>
        <use href="#od-diamond" x="318" y="274"/>
        <circle class="bubble" cx="368" cy="238" r="6"/>
      </g>
      <g id="gate-G2">
        <rect class="gate-box" x="274" y="330" width="88" height="132"/>
        <text class="gate-sym" x="318" y="368">&amp;</text>
        <use href="#od-diamond" x="318" y="432"/>
        <circle class="bubble" cx="368" cy="396" r="6"/>
      </g>
    </g>

    <!-- NOR gates G3, G4, G5 -->
    <g id="gates-nor">
      <g id="gate-G3">
        <rect class="gate-box" x="543" y="172" width="88" height="132"/>
        <text class="gate-sym" x="587" y="224">≥1</text>
        <circle class="bubble" cx="637" cy="238" r="6"/>
      </g>
      <g id="gate-G4">
        <rect class="gate-box" x="543" y="330" width="88" height="132"/>
        <text class="gate-sym" x="587" y="382">≥1</text>
        <circle class="bubble" cx="637" cy="396" r="6"/>
      </g>
      <g id="gate-G5">
        <rect class="gate-box" x="543" y="488" width="88" height="132"/>
        <text class="gate-sym" x="587" y="540">≥1</text>
        <circle class="bubble" cx="637" cy="554" r="6"/>
      </g>
    </g>

    <!-- Junction dots -->
    <g id="junctions">
      <circle class="junction" cx="456" cy="238" r="4"/>
      <circle class="junction" cx="492" cy="238" r="4"/>
      <circle class="junction" cx="492" cy="272" r="4"/>
      <circle class="junction" cx="492" cy="362" r="4"/>
      <circle class="junction" cx="492" cy="396" r="4"/>
      <circle class="junction" cx="492" cy="430" r="4"/>
      <circle class="junction" cx="492" cy="520" r="4"/>
      <circle class="junction" cx="492" cy="554" r="4"/>
    </g>

    <!-- Labels -->
    <g id="labels">
      <text class="label" x="472" y="32">V<tspan class="sub" dy="5">DD</tspan><tspan class="sup" dx="-18" dy="-15">′</tspan></text>
      <text class="label" x="475" y="109">R<tspan class="sub" dy="5">L</tspan></text>

      <text class="label" x="192" y="213" text-anchor="end">A</text>
      <text class="label" x="192" y="279" text-anchor="end">B</text>
      <text class="label" x="192" y="371" text-anchor="end">C</text>
      <text class="label" x="192" y="437" text-anchor="end">D</text>
      <text class="label" x="480" y="274" text-anchor="end">F</text>

      <text class="gate-id" x="366" y="160">G<tspan class="sub" dy="4">1</tspan></text>
      <text class="gate-id" x="366" y="318">G<tspan class="sub" dy="4">2</tspan></text>
      <text class="gate-id" x="642" y="190">G<tspan class="sub" dy="4">3</tspan></text>
      <text class="gate-id" x="642" y="348">G<tspan class="sub" dy="4">4</tspan></text>
      <text class="gate-id" x="642" y="506">G<tspan class="sub" dy="4">5</tspan></text>
    </g>
  </g>
</svg>
