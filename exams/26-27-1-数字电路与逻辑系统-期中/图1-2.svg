<svg xmlns="http://www.w3.org/2000/svg" width="795" height="562" viewBox="40 20 530 375" role="img" aria-labelledby="title desc">
  <title id="title">Two-Input TTL NOR Gate Circuit</title>
  <desc id="desc">A two-input TTL NOR gate with clamping diodes D1 and D2 at inputs A and B, input transistors T1A and T1B, parallel phase-splitter transistors T2A and T2B, and a totem-pole output stage (T3, D3, T4) driving output F.</desc>
  <defs>
    <style>
      .wire {
        fill: none;
        stroke: #111111;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bjt-base {
        fill: none;
        stroke: #111111;
        stroke-width: 2.6;
        stroke-linecap: butt;
      }
      .component {
        fill: none;
        stroke: #111111;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ground {
        fill: none;
        stroke: #111111;
        stroke-width: 2.6;
        stroke-linecap: round;
      }
      .junction {
        fill: #111111;
        stroke: none;
      }
      .label {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 20px;
        font-style: italic;
        font-weight: 700;
      }
      .sub {
        font-size: 13px;
        font-style: italic;
      }
      .sub-num {
        font-size: 13px;
        font-style: normal;
      }
    </style>

    <marker id="bjt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="context-stroke"/>
    </marker>
  </defs>

  <g id="circuit">
    <!-- Supply rail and interconnections -->
    <g id="wires">
      <!-- VCC rail -->
      <line id="wire-vcc" class="wire" x1="170" y1="48" x2="524" y2="48"/>

      <!-- Input A & clamping diode D1 -->
      <line id="wire-A" class="wire" x1="76" y1="160" x2="142" y2="160"/>
      <line id="wire-D1" class="wire" x1="102" y1="160" x2="102" y2="215"/>

      <!-- Input B & clamping diode D2 -->
      <line id="wire-B" class="wire" x1="76" y1="310" x2="142" y2="310"/>
      <line id="wire-D2" class="wire" x1="102" y1="310" x2="102" y2="365"/>

      <!-- R1A supply & base lead -->
      <line class="wire" x1="170" y1="48" x2="170" y2="70"/>
      <line class="wire" x1="170" y1="110" x2="170" y2="136"/>

      <!-- R1B supply (crosses L without junction) & base lead -->
      <polyline id="wire-R1B-vcc" class="wire" points="214,48 214,198 170,198 170,218"/>
      <line class="wire" x1="170" y1="258" x2="170" y2="286"/>

      <!-- Node L: T1A collector to T2A base -->
      <polyline id="wire-L" class="wire" points="198,160 232,160 232,185 256,185"/>

      <!-- Node M: T1B collector (crosses O-R3 vertical wire without junction) to T2B base -->
      <polyline id="wire-M" class="wire" points="198,310 404,310 404,185 384,185"/>

      <!-- R2, collector tie, and emitter-to-R3 axis -->
      <line class="wire" x1="320" y1="48" x2="320" y2="82"/>
      <line class="wire" x1="320" y1="122" x2="320" y2="155"/>
      <line class="wire" x1="280" y1="155" x2="360" y2="155"/>
      <line class="wire" x1="280" y1="215" x2="360" y2="215"/>
      <line class="wire" x1="320" y1="215" x2="320" y2="322"/>

      <!-- Node N to T3 base -->
      <line id="wire-N" class="wire" x1="320" y1="136" x2="446" y2="136"/>

      <!-- Node O (crosses M vertical wire without junction) to T4 base -->
      <line id="wire-O" class="wire" x1="320" y1="296" x2="446" y2="296"/>

      <!-- R3 to bottom ground return -->
      <polyline class="wire" points="320,362 320,376 474,376"/>

      <!-- R4, D3, F, and T4 ground axis -->
      <line class="wire" x1="474" y1="48" x2="474" y2="60"/>
      <line class="wire" x1="474" y1="98" x2="474" y2="114"/>
      <line class="wire" x1="474" y1="162" x2="474" y2="270"/>
      <line id="wire-F" class="wire" x1="474" y1="240" x2="516" y2="240"/>
      <line class="wire" x1="474" y1="326" x2="474" y2="386"/>
    </g>

    <!-- Resistors (IEC/GB rectangles) -->
    <g id="resistors">
      <rect id="res-R1A" class="component" x="163" y="70" width="14" height="40"/>
      <rect id="res-R1B" class="component" x="163" y="218" width="14" height="40"/>
      <rect id="res-R2" class="component" x="313" y="82" width="14" height="40"/>
      <rect id="res-R3" class="component" x="313" y="322" width="14" height="40"/>
      <rect id="res-R4" class="component" x="467" y="60" width="14" height="38"/>
    </g>

    <!-- Diodes (wire runs through hollow triangle, textbook style) -->
    <g id="diodes">
      <!-- D1 (pointing up) -->
      <g id="diode-D1">
        <polygon class="component" points="102,175 92,195 112,195"/>
        <line class="component" x1="92" y1="175" x2="112" y2="175"/>
      </g>
      <!-- D2 (pointing up) -->
      <g id="diode-D2">
        <polygon class="component" points="102,325 92,345 112,345"/>
        <line class="component" x1="92" y1="325" x2="112" y2="325"/>
      </g>
      <!-- D3 (pointing down) -->
      <g id="diode-D3">
        <polygon class="component" points="464,185 484,185 474,205"/>
        <line class="component" x1="464" y1="205" x2="484" y2="205"/>
      </g>
    </g>

    <!-- NPN Bipolar Transistors -->
    <g id="transistors">
      <!-- T1A (horizontal base at top) -->
      <g id="bjt-T1A">
        <line class="bjt-base" x1="150" y1="136" x2="190" y2="136"/>
        <line class="wire" x1="160" y1="136" x2="142" y2="160" marker-end="url(#bjt-arrow)"/>
        <line class="wire" x1="180" y1="136" x2="198" y2="160"/>
      </g>
      <!-- T1B (horizontal base at top) -->
      <g id="bjt-T1B">
        <line class="bjt-base" x1="150" y1="286" x2="190" y2="286"/>
        <line class="wire" x1="160" y1="286" x2="142" y2="310" marker-end="url(#bjt-arrow)"/>
        <line class="wire" x1="180" y1="286" x2="198" y2="310"/>
      </g>
      <!-- T2A (vertical base on left) -->
      <g id="bjt-T2A">
        <line class="bjt-base" x1="256" y1="165" x2="256" y2="205"/>
        <line class="wire" x1="256" y1="175" x2="280" y2="155"/>
        <line class="wire" x1="256" y1="195" x2="280" y2="215" marker-end="url(#bjt-arrow)"/>
      </g>
      <!-- T2B (vertical base on right) -->
      <g id="bjt-T2B">
        <line class="bjt-base" x1="384" y1="165" x2="384" y2="205"/>
        <line class="wire" x1="384" y1="175" x2="360" y2="155"/>
        <line class="wire" x1="384" y1="195" x2="360" y2="215" marker-end="url(#bjt-arrow)"/>
      </g>
      <!-- T3 (vertical base on left) -->
      <g id="bjt-T3">
        <line class="bjt-base" x1="446" y1="116" x2="446" y2="156"/>
        <line class="wire" x1="446" y1="126" x2="474" y2="114"/>
        <line class="wire" x1="446" y1="146" x2="474" y2="162" marker-end="url(#bjt-arrow)"/>
      </g>
      <!-- T4 (vertical base on left) -->
      <g id="bjt-T4">
        <line class="bjt-base" x1="446" y1="276" x2="446" y2="316"/>
        <line class="wire" x1="446" y1="286" x2="474" y2="270"/>
        <line class="wire" x1="446" y1="306" x2="474" y2="326" marker-end="url(#bjt-arrow)"/>
      </g>
    </g>

    <!-- Ground bars -->
    <g id="grounds">
      <line id="gnd-D1" class="ground" x1="92" y1="215" x2="112" y2="215"/>
      <line id="gnd-D2" class="ground" x1="92" y1="365" x2="112" y2="365"/>
      <line id="gnd-out" class="ground" x1="464" y1="386" x2="484" y2="386"/>
    </g>

    <!-- Junction dots -->
    <g id="junctions">
      <circle class="junction" cx="214" cy="48" r="3"/>
      <circle class="junction" cx="320" cy="48" r="3"/>
      <circle class="junction" cx="474" cy="48" r="3"/>
      <circle class="junction" cx="102" cy="160" r="3"/>
      <circle class="junction" cx="102" cy="310" r="3"/>
      <circle class="junction" cx="320" cy="136" r="3"/>
      <circle class="junction" cx="320" cy="155" r="3"/>
      <circle class="junction" cx="320" cy="215" r="3"/>
      <circle class="junction" cx="320" cy="296" r="3"/>
      <circle class="junction" cx="474" cy="240" r="3"/>
      <circle class="junction" cx="474" cy="376" r="3"/>
    </g>

    <!-- Labels -->
    <g id="labels">
      <text class="label" x="68" y="152" text-anchor="middle">A</text>
      <text class="label" x="68" y="302" text-anchor="middle">B</text>
      <text class="label" x="117" y="192">D<tspan class="sub-num" dy="4">1</tspan></text>
      <text class="label" x="117" y="342">D<tspan class="sub-num" dy="4">2</tspan></text>
      <text class="label" x="156" y="96" text-anchor="end">R<tspan class="sub-num" dy="4">1<tspan class="sub">A</tspan></tspan></text>
      <text class="label" x="156" y="244" text-anchor="end">R<tspan class="sub-num" dy="4">1<tspan class="sub">B</tspan></tspan></text>
      <text class="label" x="170" y="172" text-anchor="middle">T<tspan class="sub-num" dy="4">1<tspan class="sub">A</tspan></tspan></text>
      <text class="label" x="170" y="322" text-anchor="middle">T<tspan class="sub-num" dy="4">1<tspan class="sub">B</tspan></tspan></text>
      <text class="label" x="239" y="152">L</text>
      <text class="label" x="245" y="300">M</text>
      <text class="label" x="306" y="108" text-anchor="end">R<tspan class="sub-num" dy="4">2</tspan></text>
      <text class="label" x="335" y="128">N</text>
      <text class="label" x="292" y="192" text-anchor="middle">T<tspan class="sub-num" dy="4">2<tspan class="sub">A</tspan></tspan></text>
      <text class="label" x="348" y="192" text-anchor="middle">T<tspan class="sub-num" dy="4">2<tspan class="sub">B</tspan></tspan></text>
      <text class="label" x="335" y="288">O</text>
      <text class="label" x="306" y="348" text-anchor="end">R<tspan class="sub-num" dy="4">3</tspan></text>
      <text class="label" x="458" y="84" text-anchor="end">R<tspan class="sub-num" dy="4">4</tspan></text>
      <text class="label" x="504" y="72">V<tspan class="sub" dy="4">CC</tspan></text>
      <text class="label" x="486" y="142">T<tspan class="sub-num" dy="4">3</tspan></text>
      <text class="label" x="458" y="201" text-anchor="end">D<tspan class="sub-num" dy="4">3</tspan></text>
      <text class="label" x="502" y="228">F</text>
      <text class="label" x="486" y="304">T<tspan class="sub-num" dy="4">4</tspan></text>
    </g>
  </g>
</svg>
