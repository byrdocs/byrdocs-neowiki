<svg xmlns="http://www.w3.org/2000/svg" width="560" height="432" viewBox="0 0 280 216" role="img" aria-labelledby="title desc">
  <title id="title">NAND Gate Driving an LED Circuit</title>
  <desc id="desc">A two-input NAND gate (&amp;) whose active-low output connects through a current-limiting resistor R and a downward-pointing light-emitting diode (LED) to a +5V supply terminal.</desc>
  <defs>
    <style>
      .wire {
        fill: none;
        stroke: #111111;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .component {
        fill: none;
        stroke: #111111;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .terminal {
        fill: none;
        stroke: #111111;
        stroke-width: 2.2;
      }
      .arrow-line {
        fill: none;
        stroke: #111111;
        stroke-width: 2.2;
        stroke-linecap: round;
      }
      .label {
        fill: #111111;
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
      }
      .gate-symbol {
        fill: #111111;
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        font-size: 22px;
        font-weight: 700;
        text-anchor: middle;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
    </marker>
  </defs>

  <g id="circuit">
    <!-- Interconnecting wires -->
    <g id="wires">
      <line id="wire-input-1" class="wire" x1="44.2" y1="140" x2="65" y2="140"/>
      <line id="wire-input-2" class="wire" x1="44.2" y1="178" x2="65" y2="178"/>
      <polyline id="wire-gate-to-resistor" class="wire" points="125.4,162 178,162 178,141"/>
      <line id="wire-supply-to-resistor" class="wire" x1="178" y1="20.2" x2="178" y2="105"/>
    </g>

    <!-- Two-input NAND gate (IEC/GB rectangular style) -->
    <g id="nand-gate">
      <rect class="component" x="65" y="119" width="52" height="78"/>
      <text class="gate-symbol" x="91" y="149">&amp;</text>
      <circle id="nand-output-bubble" class="terminal" cx="121.2" cy="162" r="4.2"/>
    </g>

    <!-- Light-emitting diode (LED) -->
    <g id="led">
      <polygon class="component" points="157,43 199,43 178,75"/>
      <line class="component" x1="157" y1="75" x2="199" y2="75"/>
      <g id="led-emission-arrows">
        <line class="arrow-line" x1="204" y1="53" x2="226" y2="75" marker-end="url(#arrow)"/>
        <line class="arrow-line" x1="204" y1="73" x2="226" y2="95" marker-end="url(#arrow)"/>
      </g>
    </g>

    <!-- Current-limiting resistor R -->
    <g id="resistor">
      <rect class="component" x="171" y="105" width="14" height="36"/>
    </g>

    <!-- External terminals -->
    <g id="terminals">
      <circle id="terminal-in-1" class="terminal" cx="41" cy="140" r="3.2"/>
      <circle id="terminal-in-2" class="terminal" cx="41" cy="178" r="3.2"/>
      <circle id="terminal-vcc" class="terminal" cx="178" cy="17" r="3.2"/>
    </g>

    <!-- Text labels -->
    <g id="labels">
      <text id="label-vcc" class="label" x="194" y="24">+5V</text>
      <text id="label-resistor" class="label" x="196" y="130">R</text>
    </g>
  </g>
</svg>
