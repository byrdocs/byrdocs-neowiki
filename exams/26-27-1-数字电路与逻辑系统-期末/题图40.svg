<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="20 110 980 560" role="img" aria-labelledby="title desc">
  <title id="title">74LS138 and 74LS155 Decoder Logic Diagram</title>
  <desc id="desc">Block logic symbols for 74LS138 (3-to-8 decoder with active-low outputs Y0-Y7, inputs A0-A2, and enables SA, active-low SB, active-low SC) and 74LS155 (dual 2-to-4 decoder with active-low outputs 1F0-1F3 and 2F0-2F3), with inputs A0 and A1 shared across both devices.</desc>
  <defs>
    <style>
      .wire, .ic-box, .overbar {
        fill: none;
        stroke: #111111;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ic-name {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 32px;
        text-anchor: middle;
      }
      .ic-sym {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }
      .pin-label {
        fill: #111111;
        font-family: "Times New Roman", "STIX Two Text", Georgia, serif;
        font-size: 24px;
        font-style: italic;
        text-anchor: middle;
      }
      .pin-num {
        font-style: normal;
      }
      .sub {
        font-size: 16px;
        font-style: normal;
      }
      .sub-it {
        font-size: 16px;
        font-style: italic;
      }
    </style>
  </defs>

  <g id="diagram">
    <!-- External connecting wires -->
    <g id="wires">
      <!-- 74LS138 top outputs Y0..Y7 -->
      <line class="wire" x1="96" y1="140" x2="96" y2="210"/>
      <line class="wire" x1="138" y1="140" x2="138" y2="210"/>
      <line class="wire" x1="180" y1="140" x2="180" y2="210"/>
      <line class="wire" x1="222" y1="140" x2="222" y2="210"/>
      <line class="wire" x1="264" y1="140" x2="264" y2="210"/>
      <line class="wire" x1="306" y1="140" x2="306" y2="210"/>
      <line class="wire" x1="348" y1="140" x2="348" y2="210"/>
      <line class="wire" x1="390" y1="140" x2="390" y2="210"/>

      <!-- 74LS138 bottom inputs A0..A2, SA, SB, SC -->
      <line class="wire" x1="96" y1="440" x2="96" y2="610"/>
      <line class="wire" x1="148" y1="440" x2="148" y2="610"/>
      <line class="wire" x1="200" y1="440" x2="200" y2="610"/>
      <line class="wire" x1="290" y1="440" x2="290" y2="610"/>
      <line class="wire" x1="342" y1="440" x2="342" y2="610"/>
      <line class="wire" x1="394" y1="440" x2="394" y2="610"/>

      <!-- Shared A0 and A1 bus to 74LS155 -->
      <polyline id="wire-A0-bus" class="wire" points="96,496 566,496 566,440"/>
      <polyline id="wire-A1-bus" class="wire" points="148,532 614,532 614,440"/>

      <!-- 74LS155 top outputs 1F0..1F3, 2F0..2F3 -->
      <line class="wire" x1="566" y1="140" x2="566" y2="210"/>
      <line class="wire" x1="608" y1="140" x2="608" y2="210"/>
      <line class="wire" x1="650" y1="140" x2="650" y2="210"/>
      <line class="wire" x1="692" y1="140" x2="692" y2="210"/>
      <line class="wire" x1="750" y1="140" x2="750" y2="210"/>
      <line class="wire" x1="792" y1="140" x2="792" y2="210"/>
      <line class="wire" x1="834" y1="140" x2="834" y2="210"/>
      <line class="wire" x1="876" y1="140" x2="876" y2="210"/>

      <!-- 74LS155 bottom strobe/data pins -->
      <line class="wire" x1="682" y1="440" x2="682" y2="588"/>
      <line class="wire" x1="732" y1="440" x2="732" y2="554"/>
      <line class="wire" x1="808" y1="440" x2="808" y2="588"/>
      <line class="wire" x1="860" y1="440" x2="860" y2="554"/>
    </g>

    <!-- Polarity wedges (active-low indicators) -->
    <g id="polarity-wedges">
      <!-- 74LS138 top (sloping left) -->
      <line class="wire" x1="96" y1="184" x2="85" y2="210"/>
      <line class="wire" x1="138" y1="184" x2="127" y2="210"/>
      <line class="wire" x1="180" y1="184" x2="169" y2="210"/>
      <line class="wire" x1="222" y1="184" x2="211" y2="210"/>
      <line class="wire" x1="264" y1="184" x2="253" y2="210"/>
      <line class="wire" x1="306" y1="184" x2="295" y2="210"/>
      <line class="wire" x1="348" y1="184" x2="337" y2="210"/>
      <line class="wire" x1="390" y1="184" x2="379" y2="210"/>

      <!-- 74LS138 bottom (SB, SC left side) -->
      <polyline class="wire" points="342,440 332,464 342,464"/>
      <polyline class="wire" points="394,440 384,464 394,464"/>

      <!-- 74LS155 top (sloping right) -->
      <line class="wire" x1="566" y1="184" x2="577" y2="210"/>
      <line class="wire" x1="608" y1="184" x2="619" y2="210"/>
      <line class="wire" x1="650" y1="184" x2="661" y2="210"/>
      <line class="wire" x1="692" y1="184" x2="703" y2="210"/>
      <line class="wire" x1="750" y1="184" x2="761" y2="210"/>
      <line class="wire" x1="792" y1="184" x2="803" y2="210"/>
      <line class="wire" x1="834" y1="184" x2="845" y2="210"/>
      <line class="wire" x1="876" y1="184" x2="887" y2="210"/>

      <!-- 74LS155 bottom (1D, 2ST, 2D right side) -->
      <polyline class="wire" points="732,440 742,464 732,464"/>
      <polyline class="wire" points="808,440 818,464 808,464"/>
      <polyline class="wire" points="860,440 870,464 860,464"/>
    </g>

    <!-- 74LS138 Block -->
    <g id="ic-74LS138">
      <rect class="ic-box" x="60" y="210" width="380" height="230"/>
      <polyline class="ic-box" points="228,440 228,334 440,334"/>
      <text class="ic-name" x="158" y="308">74LS138</text>
      <text class="ic-sym" x="250" y="366">&amp;</text>

      <!-- Top pin labels Y0..Y7 with overbars -->
      <text class="pin-label" x="96" y="246">Y<tspan class="sub" dy="4">0</tspan></text>
      <line class="overbar" x1="84" y1="222" x2="108" y2="222"/>
      <text class="pin-label" x="138" y="246">Y<tspan class="sub" dy="4">1</tspan></text>
      <line class="overbar" x1="126" y1="222" x2="150" y2="222"/>
      <text class="pin-label" x="180" y="246">Y<tspan class="sub" dy="4">2</tspan></text>
      <line class="overbar" x1="168" y1="222" x2="192" y2="222"/>
      <text class="pin-label" x="222" y="246">Y<tspan class="sub" dy="4">3</tspan></text>
      <line class="overbar" x1="210" y1="222" x2="234" y2="222"/>
      <text class="pin-label" x="264" y="246">Y<tspan class="sub" dy="4">4</tspan></text>
      <line class="overbar" x1="252" y1="222" x2="276" y2="222"/>
      <text class="pin-label" x="306" y="246">Y<tspan class="sub" dy="4">5</tspan></text>
      <line class="overbar" x1="294" y1="222" x2="318" y2="222"/>
      <text class="pin-label" x="348" y="246">Y<tspan class="sub" dy="4">6</tspan></text>
      <line class="overbar" x1="336" y1="222" x2="360" y2="222"/>
      <text class="pin-label" x="390" y="246">Y<tspan class="sub" dy="4">7</tspan></text>
      <line class="overbar" x1="378" y1="222" x2="402" y2="222"/>

      <!-- Bottom pin labels inside 74LS138 -->
      <text class="pin-label" x="96" y="422">A<tspan class="sub" dy="4">0</tspan></text>
      <text class="pin-label" x="148" y="422">A<tspan class="sub" dy="4">1</tspan></text>
      <text class="pin-label" x="200" y="422">A<tspan class="sub" dy="4">2</tspan></text>
      <text class="pin-label" x="290" y="422">S<tspan class="sub-it" dy="4">A</tspan></text>
      <text class="pin-label" x="342" y="422">S<tspan class="sub-it" dy="4">B</tspan></text>
      <line class="overbar" x1="329" y1="398" x2="355" y2="398"/>
      <text class="pin-label" x="394" y="422">S<tspan class="sub-it" dy="4">C</tspan></text>
      <line class="overbar" x1="381" y1="398" x2="407" y2="398"/>
    </g>

    <!-- 74LS155 Block -->
    <g id="ic-74LS155">
      <rect class="ic-box" x="530" y="210" width="382" height="230"/>
      <text class="ic-name" x="721" y="332">74LS155</text>

      <!-- Top pin labels 1F0..1F3 and 2F0..2F3 with overbars -->
      <text class="pin-label" x="566" y="246"><tspan class="pin-num">1</tspan>F<tspan class="sub" dy="4">0</tspan></text>
      <line class="overbar" x1="550" y1="222" x2="582" y2="222"/>
      <text class="pin-label" x="608" y="246"><tspan class="pin-num">1</tspan>F<tspan class="sub" dy="4">1</tspan></text>
      <line class="overbar" x1="592" y1="222" x2="624" y2="222"/>
      <text class="pin-label" x="650" y="246"><tspan class="pin-num">1</tspan>F<tspan class="sub" dy="4">2</tspan></text>
      <line class="overbar" x1="634" y1="222" x2="666" y2="222"/>
      <text class="pin-label" x="692" y="246"><tspan class="pin-num">1</tspan>F<tspan class="sub" dy="4">3</tspan></text>
      <line class="overbar" x1="676" y1="222" x2="708" y2="222"/>

      <text class="pin-label" x="750" y="246"><tspan class="pin-num">2</tspan>F<tspan class="sub" dy="4">0</tspan></text>
      <line class="overbar" x1="734" y1="222" x2="766" y2="222"/>
      <text class="pin-label" x="792" y="246"><tspan class="pin-num">2</tspan>F<tspan class="sub" dy="4">1</tspan></text>
      <line class="overbar" x1="776" y1="222" x2="808" y2="222"/>
      <text class="pin-label" x="834" y="246"><tspan class="pin-num">2</tspan>F<tspan class="sub" dy="4">2</tspan></text>
      <line class="overbar" x1="818" y1="222" x2="850" y2="222"/>
      <text class="pin-label" x="876" y="246"><tspan class="pin-num">2</tspan>F<tspan class="sub" dy="4">3</tspan></text>
      <line class="overbar" x1="860" y1="222" x2="892" y2="222"/>

      <!-- Bottom pin labels inside 74LS155 -->
      <text class="pin-label" x="566" y="422">A<tspan class="sub" dy="4">0</tspan></text>
      <text class="pin-label" x="614" y="422">A<tspan class="sub" dy="4">1</tspan></text>
      <text class="pin-label" x="682" y="422"><tspan class="pin-num">1</tspan>ST</text>
      <text class="pin-label" x="732" y="422"><tspan class="pin-num">1</tspan>D</text>
      <line class="overbar" x1="718" y1="398" x2="746" y2="398"/>
      <text class="pin-label" x="808" y="422"><tspan class="pin-num">2</tspan>ST</text>
      <line class="overbar" x1="788" y1="398" x2="828" y2="398"/>
      <text class="pin-label" x="860" y="422"><tspan class="pin-num">2</tspan>D</text>
      <line class="overbar" x1="846" y1="398" x2="874" y2="398"/>
    </g>

    <!-- Bottom external signal labels -->
    <g id="labels">
      <text class="pin-label" x="96" y="640">A<tspan class="sub" dy="4">0</tspan></text>
      <text class="pin-label" x="148" y="640">A<tspan class="sub" dy="4">1</tspan></text>
      <text class="pin-label" x="200" y="640">A<tspan class="sub" dy="4">2</tspan></text>
      <text class="pin-label" x="290" y="640">A<tspan class="sub" dy="4">3</tspan></text>
    </g>
  </g>
</svg>
