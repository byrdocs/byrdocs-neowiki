<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250">
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#111111" />
    </marker>
  </defs>

  <style>
    .line { stroke: #111111; stroke-width: 1.8; fill: none; }
    .box { stroke: #111111; stroke-width: 1.8; fill: #ffffff; }
    .math { font-family: "Times New Roman", Times, serif; font-size: 20px; fill: #111111; }
    .italic { font-style: italic; }
    .sub { font-size: 14px; }
    .zh { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 19px; fill: #111111; }
  </style>

  <!-- Input m(t) to first multiplier -->
  <line x1="28" y1="75" x2="107" y2="75" class="line" marker-end="url(#arrow)" />
  <text x="66" y="57" text-anchor="middle" class="math">
    <tspan class="italic">m</tspan>(<tspan class="italic">t</tspan>)
  </text>

  <!-- First multiplier -->
  <circle cx="125" cy="75" r="16" class="box" />
  <line x1="113.7" y1="63.7" x2="136.3" y2="86.3" class="line" />
  <line x1="113.7" y1="86.3" x2="136.3" y2="63.7" class="line" />

  <!-- Local carrier into first multiplier -->
  <line x1="125" y1="185" x2="125" y2="93" class="line" marker-end="url(#arrow)" />
  <text x="125" y="210" text-anchor="middle" class="math">
    cos<tspan class="italic">ω</tspan><tspan dy="4" class="sub italic">c</tspan><tspan dy="-4" class="italic">t</tspan>
  </text>

  <!-- x(t) line from first multiplier to second multiplier -->
  <line x1="141" y1="75" x2="342" y2="75" class="line" marker-end="url(#arrow)" />
  <text x="195" y="57" text-anchor="middle" class="math">
    <tspan class="italic">x</tspan>(<tspan class="italic">t</tspan>)
  </text>

  <!-- Carrier recovery branch -->
  <circle cx="240" cy="75" r="2.6" fill="#111111" />
  <line x1="240" y1="75" x2="240" y2="145" class="line" marker-end="url(#arrow)" />
  <rect x="195" y="147" width="90" height="62" class="box" />
  <text x="240" y="172" text-anchor="middle" class="zh">载波</text>
  <text x="240" y="196" text-anchor="middle" class="zh">恢复</text>

  <!-- Recovered carrier to second multiplier -->
  <polyline points="285,178 360,178 360,93" class="line" marker-end="url(#arrow)" />
  <text x="372" y="146" text-anchor="start" class="math">
    2cos(<tspan class="italic">ω</tspan><tspan dy="4" class="sub italic">c</tspan><tspan dy="-4" class="italic">t</tspan> + <tspan class="italic">θ</tspan>)
  </text>

  <!-- Second multiplier -->
  <circle cx="360" cy="75" r="16" class="box" />
  <line x1="348.7" y1="63.7" x2="371.3" y2="86.3" class="line" />
  <line x1="348.7" y1="86.3" x2="371.3" y2="63.7" class="line" />

  <!-- g(t) to LPF -->
  <line x1="376" y1="75" x2="443" y2="75" class="line" marker-end="url(#arrow)" />
  <text x="410" y="57" text-anchor="middle" class="math">
    <tspan class="italic">g</tspan>(<tspan class="italic">t</tspan>)
  </text>

  <!-- LPF -->
  <rect x="445" y="45" width="95" height="60" class="box" />
  <text x="492.5" y="82" text-anchor="middle" class="math" style="font-family: 'Noto Sans SC', Arial, sans-serif; font-size: 21px;">LPF</text>

  <!-- Output y(t) -->
  <line x1="540" y1="75" x2="612" y2="75" class="line" marker-end="url(#arrow)" />
  <text x="575" y="57" text-anchor="middle" class="math">
    <tspan class="italic">y</tspan>(<tspan class="italic">t</tspan>)
  </text>
</svg>
