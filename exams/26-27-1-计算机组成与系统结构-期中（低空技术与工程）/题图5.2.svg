<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 96" width="640" height="96">
  <rect width="100%" height="100%" fill="#ffffff" />
  <style>
    .cell { fill: #ffffff; stroke: #1f2933; stroke-width: 1.8; }
    .bit { fill: #1f2933; font-family: "Times New Roman", "Noto Serif CJK SC", "SimSun", serif; font-size: 16px; dominant-baseline: central; }
    .label-latin { fill: #1f2933; font-family: "Times New Roman", "Noto Serif CJK SC", "SimSun", serif; font-size: 18px; text-anchor: middle; dominant-baseline: central; }
    .label-cjk { fill: #1f2933; font-family: "Noto Serif CJK SC", "SimSun", "Microsoft YaHei", serif; font-size: 18px; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Bit indices above cells (15..11 | bit 10 | 9..5 | 4..0) -->
  <text x="48" y="24" class="bit" text-anchor="start">15</text>
  <text x="196" y="24" class="bit" text-anchor="end">11</text>
  <text x="284" y="24" class="bit" text-anchor="start">9</text>
  <text x="424" y="24" class="bit" text-anchor="end">5</text>
  <text x="456" y="24" class="bit" text-anchor="start">4</text>
  <text x="596" y="24" class="bit" text-anchor="end">0</text>

  <!-- Instruction format fields -->
  <rect x="24" y="40" width="192" height="38" class="cell" />
  <text x="120" y="59" class="label-latin">OP</text>

  <rect x="216" y="40" width="52" height="38" class="cell" />
  <text x="242" y="59" class="label-latin">-</text>

  <rect x="268" y="40" width="172" height="38" class="cell" />
  <text x="354" y="59" class="label-cjk">目标寄存器</text>

  <rect x="440" y="40" width="176" height="38" class="cell" />
  <text x="528" y="59" class="label-cjk">源寄存器</text>
</svg>
