<svg xmlns="http://www.w3.org/2000/svg" width="500" height="268" viewBox="110 588 500 268" role="img" aria-labelledby="title desc">
  <title id="title">选项 C</title>
  <desc id="desc">下降沿 JK 触发器，Q 经框顶接到 J，K 接 D，时钟在右侧。</desc>
  <rect id="background" x="110" y="588" width="500" height="268" fill="#fff"/>
  <defs>
    <style>
