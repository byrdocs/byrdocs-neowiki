      .tri { fill: #fff; stroke: #111; stroke-width: 2.2; stroke-linejoin: miter; }
      .bar { stroke: #111; stroke-width: 1.8; }
      .txt { fill: #111; font-family: "Times New Roman", "Noto Serif", "SimSun", serif; font-size: 24px; font-style: italic; }
      .gate { fill: #111; font-family: "Times New Roman", "Noto Serif", serif; font-size: 24px; text-anchor: middle; }
      .opt { fill: #111; font-family: "Times New Roman", "Noto Serif", serif; font-size: 22px; }
      .radio { fill: #fff; stroke: #555; stroke-width: 1.6; }
