      <line id="wire-d1" class="wire" x1="402" y1="150" x2="402" y2="552"/>
      <line id="wire-d2" class="wire" x1="438" y1="186" x2="438" y2="552"/>
      <line id="wire-d3" class="wire" x1="474" y1="150" x2="474" y2="552"/>
      <line id="wire-d4" class="wire" x1="546" y1="186" x2="546" y2="552"/>
      <line id="wire-d5" class="wire" x1="582" y1="150" x2="582" y2="552"/>
      <line id="wire-d6" class="wire" x1="618" y1="186" x2="618" y2="552"/>
      <line id="wire-d7" class="wire" x1="654" y1="150" x2="654" y2="552"/>
      <line id="wire-d8" class="wire" x1="874" y1="186" x2="874" y2="552"/>
      <line id="wire-d9" class="wire" x1="910" y1="150" x2="910" y2="552"/>
      <line id="wire-d10" class="wire" x1="946" y1="186" x2="946" y2="552"/>
      <line id="wire-d11" class="wire" x1="982" y1="150" x2="982" y2="552"/>
      <line id="wire-d12" class="wire" x1="1054" y1="186" x2="1054" y2="552"/>
      <line id="wire-d13" class="wire" x1="1090" y1="150" x2="1090" y2="552"/>
      <line id="wire-d14" class="wire" x1="1126" y1="186" x2="1126" y2="552"/>
      <line id="wire-d15" class="wire" x1="1162" y1="150" x2="1162" y2="552"/>

      <!-- four mux outputs into the OR gate, top side -->
