      <circle id="bub-y3" class="bubble" cx="259" cy="248" r="7"/>
      <circle id="bub-y2" class="bubble" cx="259" cy="296" r="7"/>
      <circle id="bub-y1" class="bubble" cx="259" cy="344" r="7"/>
      <circle id="bub-y0" class="bubble" cx="259" cy="392" r="7"/>
      <circle id="bub-ls1" class="bubble" cx="330" cy="545" r="7"/>
      <circle id="bub-ls2" class="bubble" cx="510" cy="545" r="7"/>
      <circle id="bub-rs1" class="bubble" cx="838" cy="545" r="7"/>
      <circle id="bub-rs2" class="bubble" cx="1018" cy="545" r="7"/>
    </g>

    <g id="junctions">
      <circle id="dot-s3" class="dot" cx="48" cy="152" r="3.6"/>
      <circle id="dot-a2" class="dot" cx="48" cy="248" r="3.6"/>
      <circle id="dot-a1" class="dot" cx="268" cy="478" r="3.6"/>
      <circle id="dot-a0" class="dot" cx="228" cy="520" r="3.6"/>
    </g>

    <g id="or-gate">
      <rect id="or-box" class="box" x="744" y="804" width="148" height="52"/>
      <line class="wire" x1="818" y1="816" x2="818" y2="844"/>
      <line class="wire" x1="804" y1="830" x2="832" y2="830"/>
      <text class="ext" x="818" y="888" text-anchor="middle">Y</text>
    </g>

    <g id="labels">
      <text class="one" x="16" y="64">1</text>
      <text class="ext" x="14" y="350">A<tspan class="extsub" dy="5">3</tspan></text>
      <text class="ext" x="14" y="398">A<tspan class="extsub" dy="5">2</tspan></text>
      <text class="ext" x="12" y="484">A<tspan class="extsub" dy="5">1</tspan></text>
      <text class="ext" x="12" y="526">A<tspan class="extsub" dy="5">0</tspan></text>

      <g id="labels-138">
        <text class="pin" x="108" y="61">S<tspan class="sub" dy="4">1</tspan></text>
        <text class="pin" x="108" y="109">S</text>
        <line class="bar" x1="108" y1="96" x2="118" y2="96"/>
        <text class="sub" x="119" y="113">2</text>
        <text class="pin" x="108" y="157">S</text>
        <line class="bar" x1="108" y1="144" x2="118" y2="144"/>
