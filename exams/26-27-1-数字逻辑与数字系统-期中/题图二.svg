      <polyline id="out-right-y1" class="wire" points="920,708 920,740 836,740 836,804"/>
      <polyline id="out-left-y1" class="wire" points="410,708 410,772 760,772 760,804"/>
      <polyline id="out-right-y2" class="wire" points="1108,708 1108,772 872,772 872,804"/>
