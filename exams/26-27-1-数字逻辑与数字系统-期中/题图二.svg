<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" role="img" aria-labelledby="title desc">
  <title id="title">74LS138 与两片 74LS153 组成的数据选择电路</title>
  <desc id="desc">74LS138 的 S1 接 1，S2、S3 和 A2 接地，A1、A0 分别接 A3、A2。Y0 至 Y3 依次接到两片 74LS153 的四个低有效使能端，Y4 至 Y7 悬空。D0 至 D15 接入两片选择器的数据端，A1、A0 为公共地址。四路输出进入下方带加号的或门，或门下方标为 Y，图中没有画出输出引线。</desc>
  <defs>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 2.6; }
      .wire { fill: none; stroke: #111; stroke-width: 2.3; stroke-linecap: square; stroke-linejoin: miter; }
      .bubble { fill: #fff; stroke: #111; stroke-width: 2.3; }
      .dot { fill: #111; }
      .bar { fill: none; stroke: #111; stroke-width: 1.35; stroke-linecap: butt; }
      .pin { fill: #111; font-family: "Times New Roman", "Noto Serif", SimSun, serif; font-style: italic; font-weight: 700; font-size: 15px; }
      .topin { fill: #111; font-family: "Times New Roman", "Noto Serif", SimSun, serif; font-style: italic; font-weight: 700; font-size: 13px; }
      .sub { font-family: "Times New Roman", "Noto Serif", SimSun, serif; font-style: italic; font-weight: 700; font-size: 11px; }
      .ext { fill: #111; font-family: "Times New Roman", "Noto Serif", SimSun, serif; font-style: italic; font-weight: 700; font-size: 18px; }
      .extsub { font-family: "Times New Roman", "Noto Serif", SimSun, serif; font-style: italic; font-weight: 700; font-size: 13px; }
      .chip { fill: #111; font-family: "Times New Roman", Arial, sans-serif; font-style: normal; font-weight: 700; font-size: 18px; }
      .one { fill: #111; font-family: "Times New Roman", Arial, sans-serif; font-style: normal; font-weight: 700; font-size: 22px; }
    </style>
  </defs>
  <g id="diagram">
    <rect id="background" width="1240" height="920" fill="#fff"/>

    <g id="chips">
      <rect id="ic-138" class="box" x="96" y="24" width="156" height="408"/>
      <rect id="ic-153-left" class="box" x="300" y="552" width="400" height="156"/>
      <rect id="ic-153-right" class="box" x="808" y="552" width="400" height="156"/>
    </g>

    <g id="wires">
      <!-- 138 enables and grounded A2 -->
      <line id="wire-logic-1" class="wire" x1="38" y1="56" x2="96" y2="56"/>
      <line id="rail-gnd" class="wire" x1="48" y1="104" x2="48" y2="270"/>
      <line id="wire-s2" class="wire" x1="48" y1="104" x2="82" y2="104"/>
      <line id="wire-s3" class="wire" x1="48" y1="152" x2="82" y2="152"/>
      <line id="wire-138-a2" class="wire" x1="48" y1="248" x2="96" y2="248"/>
      <g id="ground-symbol">
        <line class="wire" x1="34" y1="270" x2="62" y2="270"/>
        <line class="wire" x1="39" y1="276" x2="57" y2="276"/>
        <line class="wire" x1="44" y1="282" x2="52" y2="282"/>
      </g>
      <line id="wire-a3" class="wire" x1="40" y1="344" x2="96" y2="344"/>
      <line id="wire-a2" class="wire" x1="40" y1="392" x2="96" y2="392"/>

      <!-- 138 active-low outputs. Y4-Y7 are open stubs. -->
      <line id="stub-y7" class="wire" x1="266" y1="56" x2="308" y2="56"/>
      <line id="stub-y6" class="wire" x1="266" y1="104" x2="308" y2="104"/>
      <line id="stub-y5" class="wire" x1="266" y1="152" x2="308" y2="152"/>
      <line id="stub-y4" class="wire" x1="266" y1="200" x2="308" y2="200"/>
      <polyline id="wire-y3" class="wire" points="266,248 1018,248 1018,538"/>
      <polyline id="wire-y2" class="wire" points="266,296 838,296 838,538"/>
      <polyline id="wire-y1" class="wire" points="266,344 510,344 510,538"/>
      <polyline id="wire-y0" class="wire" points="266,392 330,392 330,538"/>

      <!-- shared address buses -->
      <line id="bus-a1" class="wire" x1="42" y1="478" x2="772" y2="478"/>
      <line id="bus-a0" class="wire" x1="42" y1="520" x2="742" y2="520"/>
      <polyline id="tap-a1-left" class="wire" points="268,478 268,612 300,612"/>
      <polyline id="tap-a0-left" class="wire" points="228,520 228,662 300,662"/>
