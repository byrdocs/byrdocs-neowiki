        <text class="pin" x="108" y="397">A<tspan class="sub" dy="4">0</tspan></text>

        <g id="label-y7"><text class="pin" x="214" y="61">Y</text><line class="bar" x1="214" y1="48" x2="226" y2="48"/><text class="sub" x="227" y="65">7</text></g>
        <g id="label-y6"><text class="pin" x="214" y="109">Y</text><line class="bar" x1="214" y1="96" x2="226" y2="96"/><text class="sub" x="227" y="113">6</text></g>
        <g id="label-y5"><text class="pin" x="214" y="157">Y</text><line class="bar" x1="214" y1="144" x2="226" y2="144"/><text class="sub" x="227" y="161">5</text></g>
        <g id="label-y4"><text class="pin" x="214" y="205">Y</text><line class="bar" x1="214" y1="192" x2="226" y2="192"/><text class="sub" x="227" y="209">4</text></g>
        <g id="label-y3"><text class="pin" x="214" y="253">Y</text><line class="bar" x1="214" y1="240" x2="226" y2="240"/><text class="sub" x="227" y="257">3</text></g>
        <g id="label-y2"><text class="pin" x="214" y="301">Y</text><line class="bar" x1="214" y1="288" x2="226" y2="288"/><text class="sub" x="227" y="305">2</text></g>
        <g id="label-y1"><text class="pin" x="214" y="349">Y</text><line class="bar" x1="214" y1="336" x2="226" y2="336"/><text class="sub" x="227" y="353">1</text></g>
        <g id="label-y0"><text class="pin" x="214" y="397">Y</text><line class="bar" x1="214" y1="384" x2="226" y2="384"/><text class="sub" x="227" y="401">0</text></g>
        <text class="chip" x="174" y="250" text-anchor="middle" transform="rotate(-90 174 250)">74LS138</text>
      </g>

      <g id="labels-153-left">
        <text class="topin" x="322" y="574">S</text>
        <line class="bar" x1="322" y1="562" x2="330" y2="562"/>
        <text class="sub" x="331" y="578">1</text>
        <text class="topin" x="366" y="578" text-anchor="middle">D<tspan class="sub" dy="3">10</tspan></text>
        <text class="topin" x="402" y="578" text-anchor="middle">D<tspan class="sub" dy="3">11</tspan></text>
        <text class="topin" x="438" y="578" text-anchor="middle">D<tspan class="sub" dy="3">12</tspan></text>
        <text class="topin" x="474" y="578" text-anchor="middle">D<tspan class="sub" dy="3">13</tspan></text>
        <text class="topin" x="502" y="574">S</text>
        <line class="bar" x1="502" y1="562" x2="510" y2="562"/>
        <text class="sub" x="511" y="578">2</text>
