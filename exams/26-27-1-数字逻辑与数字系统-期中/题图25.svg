<svg xmlns="http://www.w3.org/2000/svg" width="710" height="268" viewBox="0 0 710 268" role="img" aria-labelledby="title desc">
  <title id="title">逻辑门输入 A、B 与输出 F 的时序波形</title>
  <desc id="desc">三条时序波形。高电平在上，低电平在下。时间分为 16 格，跳变位于第 3、5、7、9、10、11、14 格。</desc>
  <defs>
    <style>
      .trace { fill: none; stroke: #111; stroke-width: 8; stroke-linecap: butt; stroke-linejoin: miter; }
      .label { fill: #111; font-family: "Times New Roman", "Noto Serif", "SimSun", serif; font-weight: 700; font-style: italic; font-size: 30px; }
    </style>
  </defs>
  <!-- x = 100 + 36 * unit; edges at units 0, 3, 5, 7, 9, 10, 11, 14, 16 -->
  <g id="diagram">
    <g id="trace-A">
      <polyline class="trace" points="100,86 208,86 208,46 352,46 352,86 424,86 424,46 496,46 496,86 676,86"/>
      <text class="label" x="86" y="96" text-anchor="end">A</text>
    </g>
    <g id="trace-B">
      <polyline class="trace" points="100,162 280,162 280,122 352,122 352,162 460,162 460,122 604,122 604,162 676,162"/>
      <text class="label" x="86" y="172" text-anchor="end">B</text>
    </g>
    <g id="trace-F">
      <polyline class="trace" points="100,198 208,198 208,238 280,238 280,198 424,198 424,238 460,238 460,198 496,198 496,238 604,238 604,198 676,198"/>
      <text class="label" x="86" y="208" text-anchor="end">F</text>
    </g>
  </g>
</svg>
