<svg xmlns="http://www.w3.org/2000/svg" width="916" height="584" viewBox="0 0 916 584" role="img" aria-labelledby="title desc">
  <title id="title">74LS253 引脚与功能表</title>
  <desc id="desc">双四选一数据选择器 74LS253 的引脚排列，以及选通、地址、数据和输出的功能表。1EN 与 2EN 为低电平有效，输出高阻记为 (Z)。</desc>
  <defs>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 4; }
      .wire { fill: none; stroke: #111; stroke-width: 2.4; stroke-linecap: butt; }
      .grid { fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: butt; }
      .bubble { fill: #fff; stroke: #111; stroke-width: 2.2; }
      .mark { fill: none; stroke: #111; stroke-width: 2.4; stroke-linejoin: miter; }
      .bar { fill: none; stroke: #111; stroke-width: 1.7; stroke-linecap: butt; }
      .part { fill: #111; font-family: "Times New Roman", "Noto Serif", Times, serif; font-weight: 700; font-size: 22px; }
      .part-sm { fill: #111; font-family: "Times New Roman", "Noto Serif", Times, serif; font-weight: 700; font-size: 18px; }
      .cn { fill: #111; font-family: "SimHei", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-weight: 700; font-size: 22px; }
      .cn-lg { fill: #111; font-family: "SimHei", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-weight: 700; font-size: 24px; }
      .pin { fill: #111; font-family: "Times New Roman", "Noto Serif", Times, serif; font-weight: 700; font-size: 20px; }
      .var { fill: #111; font-family: "Times New Roman", "Noto Serif", Times, serif; font-weight: 700; font-style: italic; font-size: 20px; }
      .bit { fill: #111; font-family: "Times New Roman", "Noto Serif", Times, serif; font-weight: 700; font-size: 20px; }
      .sub { font-size: 13px; font-style: italic; font-weight: 700; }
    </style>
  </defs>
  <rect width="916" height="584" fill="#fff"/>
  <g id="diagram">
    <g id="table">
      <g class="grid">
        <line x1="416" y1="85" x2="824" y2="85"/>
        <line x1="416" y1="140" x2="741" y2="140"/>
        <line x1="416" y1="196" x2="824" y2="196"/>
        <line x1="416" y1="252" x2="824" y2="252"/>
        <line x1="416" y1="532" x2="824" y2="532"/>
        <line x1="522" y1="140" x2="522" y2="532"/>
        <line x1="632" y1="140" x2="632" y2="532"/>
        <line x1="741" y1="85" x2="741" y2="532"/>
      </g>
      <text class="cn-lg" x="650" y="67">74LS253 功能表</text>
      <text class="cn" x="535" y="122" text-anchor="middle">输</text>
      <text class="cn" x="621" y="122" text-anchor="middle">入</text>
      <text class="cn" x="469" y="178" text-anchor="middle">选通</text>
      <text class="cn" x="577" y="178" text-anchor="middle">地址</text>
      <text class="cn" x="686" y="178" text-anchor="middle">数据</text>
      <text class="cn" x="782" y="152" text-anchor="middle">输出</text>
      <line class="bar" x1="451" y1="208" x2="487" y2="208"/>
      <text class="var" x="469" y="232" text-anchor="middle">EN</text>
      <text class="var" x="556" y="230" text-anchor="middle">A<tspan class="sub" baseline-shift="sub">1</tspan></text>
      <text class="var" x="600" y="230" text-anchor="middle">A<tspan class="sub" baseline-shift="sub">0</tspan></text>
      <text class="var" x="686" y="230" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">i</tspan></text>
      <text class="var" x="782" y="232" text-anchor="middle">Y</text>
      <g id="table-body" class="bit">
        <text x="469" y="288" text-anchor="middle">1</text>
        <text x="556" y="288" text-anchor="middle">×</text>
        <text x="600" y="288" text-anchor="middle">×</text>
        <text x="686" y="288" text-anchor="middle">×</text>
        <text class="var" x="782" y="288" text-anchor="middle">(Z)</text>
        <text x="469" y="344" text-anchor="middle">0</text>
        <text x="556" y="344" text-anchor="middle">0</text>
        <text x="600" y="344" text-anchor="middle">0</text>
        <text class="var" x="686" y="344" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">0</tspan><tspan baseline-shift="baseline"> ~ </tspan>D<tspan class="sub" baseline-shift="sub">3</tspan></text>
        <text class="var" x="782" y="344" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">0</tspan></text>
        <text x="469" y="400" text-anchor="middle">0</text>
        <text x="556" y="400" text-anchor="middle">0</text>
        <text x="600" y="400" text-anchor="middle">1</text>
        <text class="var" x="686" y="400" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">0</tspan><tspan baseline-shift="baseline"> ~ </tspan>D<tspan class="sub" baseline-shift="sub">3</tspan></text>
        <text class="var" x="782" y="400" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">1</tspan></text>
        <text x="469" y="456" text-anchor="middle">0</text>
        <text x="556" y="456" text-anchor="middle">1</text>
        <text x="600" y="456" text-anchor="middle">0</text>
        <text class="var" x="686" y="456" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">0</tspan><tspan baseline-shift="baseline"> ~ </tspan>D<tspan class="sub" baseline-shift="sub">3</tspan></text>
        <text class="var" x="782" y="456" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">2</tspan></text>
        <text x="469" y="512" text-anchor="middle">0</text>
        <text x="556" y="512" text-anchor="middle">1</text>
        <text x="600" y="512" text-anchor="middle">1</text>
        <text class="var" x="686" y="512" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">0</tspan><tspan baseline-shift="baseline"> ~ </tspan>D<tspan class="sub" baseline-shift="sub">3</tspan></text>
        <text class="var" x="782" y="512" text-anchor="middle">D<tspan class="sub" baseline-shift="sub">3</tspan></text>
      </g>
    </g>

    <g id="chip">
      <text class="part" x="218" y="54" text-anchor="middle">74LS253</text>
      <rect class="box" x="118" y="66" width="202" height="447"/>
      <polygon class="mark" points="285,117 307,117 296,137"/>
      <g id="left-pins">
        <g class="wire">
          <line x1="48" y1="94" x2="118" y2="94"/>
          <line x1="48" y1="128" x2="118" y2="128"/>
          <line x1="48" y1="161" x2="118" y2="161"/>
          <line x1="48" y1="197" x2="118" y2="197"/>
          <line x1="48" y1="228" x2="101" y2="228"/>
          <line x1="48" y1="275" x2="118" y2="275"/>
          <line x1="48" y1="307" x2="118" y2="307"/>
          <line x1="48" y1="341" x2="118" y2="341"/>
          <line x1="48" y1="375" x2="118" y2="375"/>
          <line x1="48" y1="408" x2="101" y2="408"/>
          <line x1="48" y1="450" x2="118" y2="450"/>
          <line x1="48" y1="487" x2="118" y2="487"/>
        </g>
        <circle class="bubble" cx="110" cy="228" r="8.5"/>
        <circle class="bubble" cx="110" cy="408" r="8.5"/>
        <g class="pin">
          <text x="82" y="84" text-anchor="end">6</text>
          <text x="82" y="118" text-anchor="end">5</text>
          <text x="82" y="152" text-anchor="end">4</text>
          <text x="82" y="188" text-anchor="end">3</text>
          <text x="82" y="220" text-anchor="end">1</text>
          <text x="82" y="262" text-anchor="end">10</text>
          <text x="82" y="298" text-anchor="end">11</text>
          <text x="82" y="330" text-anchor="end">12</text>
          <text x="82" y="366" text-anchor="end">13</text>
          <text x="82" y="400" text-anchor="end">15</text>
          <text x="82" y="442" text-anchor="end">2</text>
          <text x="82" y="478" text-anchor="end">14</text>
        </g>
        <g class="var">
          <text x="134" y="102">1D<tspan class="sub" baseline-shift="sub">0</tspan></text>
          <text x="134" y="136">1D<tspan class="sub" baseline-shift="sub">1</tspan></text>
          <text x="134" y="169">1D<tspan class="sub" baseline-shift="sub">2</tspan></text>
          <text x="134" y="205">1D<tspan class="sub" baseline-shift="sub">3</tspan></text>
          <text x="134" y="236">1EN</text>
          <text x="134" y="283">2D<tspan class="sub" baseline-shift="sub">0</tspan></text>
          <text x="134" y="315">2D<tspan class="sub" baseline-shift="sub">1</tspan></text>
          <text x="134" y="349">2D<tspan class="sub" baseline-shift="sub">2</tspan></text>
          <text x="134" y="383">2D<tspan class="sub" baseline-shift="sub">3</tspan></text>
          <text x="134" y="416">2EN</text>
          <text x="134" y="458">A<tspan class="sub" baseline-shift="sub">1</tspan></text>
          <text x="134" y="495">A<tspan class="sub" baseline-shift="sub">0</tspan></text>
        </g>
      </g>
      <g id="right-pins">
        <g class="wire">
          <line x1="320" y1="186" x2="396" y2="186"/>
          <line x1="320" y1="306" x2="396" y2="306"/>
        </g>
        <g class="var">
          <text x="310" y="194" text-anchor="end">1Y</text>
          <text x="310" y="314" text-anchor="end">2Y</text>
        </g>
        <g class="pin">
          <text x="392" y="178" text-anchor="end">7</text>
          <text x="392" y="296" text-anchor="end">9</text>
        </g>
      </g>
    </g>
  </g>
</svg>
